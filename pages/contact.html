<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系方式 - 个人简历</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="contact-page">
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">我的简历</a>
      <ul class="nav-links">
        <li><a href="../index.html">首页</a></li>
        <li><a href="about.html">关于我</a></li>
        <li><a href="projects.html">校园生活</a></li>
        <li><a href="contact.html">联系方式</a></li>
      </ul>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <section class="contact">
    <div class="container">
      <h2>联系方式</h2>
      <div class="contact-content">
        <div class="contact-info">
          <div class="contact-item">
            <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?w=100&h=100&fit=crop" alt="邮箱">
            <div>
              <h3>📧 邮箱</h3>
              <p>student@example.com</p>
            </div>
          </div>
          <div class="contact-item">
            <img src="https://images.unsplash.com/photo-1512428559087-560fa5ceab42?w=100&h=100&fit=crop" alt="电话">
            <div>
              <h3>📱 电话</h3>
              <p>138-XXXX-XXXX</p>
            </div>
          </div>
          <div class="contact-item">
            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?w=100&h=100&fit=crop" alt="地址">
            <div>
              <h3>📍 地址</h3>
              <p>大学信息工程学院</p>
            </div>
          </div>
        </div>
        <div class="contact-form">
          <h3>💬 给我留言</h3>
          <form>
            <input type="text" placeholder="您的姓名" required>
            <input type="email" placeholder="您的邮箱" required>
            <textarea placeholder="留言内容..." rows="5" required></textarea>
            <button type="submit" class="btn btn-primary">发送留言 ✨</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>&copy; 我的个人简历. 保留所有权利.</p>
    </div>
  </footer>
</body>
</html>
